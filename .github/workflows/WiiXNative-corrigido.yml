name: WiiXNative Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/WiiXNative.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build WiiXNative (Android ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          SETTINGS="$(find . -type f \\( -name settings.gradle.kts -o -name settings.gradle \\) -not -path '*/.gradle/*' -not -path '*/build/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::Não encontrei settings.gradle.kts ou settings.gradle. Envie também os arquivos completos do projeto Android para o GitHub; somente o arquivo YML não gera um APK."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Encontrei as configurações Gradle em $PROJECT_DIR, mas não encontrei app/build.gradle(.kts)."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK, NDK e CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Ajustar nome do aplicativo para WiiXNative
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/WiiXEmu/WiiXNative/g' app/src/main/AndroidManifest.xml
          fi
          if [ -f settings.gradle.kts ]; then
            sed -i 's/WiiXEmu/WiiXNative/g' settings.gradle.kts
          elif [ -f settings.gradle ]; then
            sed -i 's/WiiXEmu/WiiXNative/g' settings.gradle
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/dev\.wiixemu\.android/dev.wiixnative.android/g; s/versionName = "0.5.0"/versionName = "0.1.0"/g' app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            sed -i 's/dev\.wiixemu\.android/dev.wiixnative.android/g; s/versionName "0.5.0"/versionName "0.1.0"/g' app/build.gradle
          fi

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK ARM64
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-Android-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
