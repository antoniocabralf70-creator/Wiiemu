name: WiiXNative Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build WiiXNative Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -type f -name "settings.gradle.kts" -not -path "*/.gradle/*" -not -path "*/build/*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find . -type f -name "settings.gradle" -not -path "*/.gradle/*" -not -path "*/build/*" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Não encontrei settings.gradle.kts nem settings.gradle."
            echo "Confira se os arquivos do projeto Android foram enviados ao repositório."
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Não encontrei app/build.gradle.kts nem app/build.gradle em $PROJECT_DIR."
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml não encontrado em $PROJECT_DIR/app/src/main/."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK, NDK e CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace -p "${{ steps.project.outputs.dir }}" :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-Android-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
