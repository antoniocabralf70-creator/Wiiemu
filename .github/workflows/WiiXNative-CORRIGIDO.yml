name: WiiXNative Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build WiiXNative Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Localizar automaticamente o projeto Android
        id: project
        shell: bash
        run: |
          echo "Conteúdo do repositório:"
          ls -la

          PROJECT_DIR=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if { [ -f "$candidate/app/build.gradle.kts" ] || [ -f "$candidate/app/build.gradle" ]; }               && [ -f "$candidate/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "*/.gradle/*")

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android Gradle não encontrado."
            echo "O repositório precisa conter settings.gradle(.kts), app/build.gradle(.kts) e app/src/main/AndroidManifest.xml na mesma estrutura de projeto."
            echo "Confira se você enviou todos os arquivos do projeto, não somente o WiiXNative.yml."
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."
          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK, NDK e CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace -p "${{ steps.project.outputs.dir }}" :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-Android-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
