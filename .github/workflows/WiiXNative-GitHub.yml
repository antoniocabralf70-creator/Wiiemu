name: WiiXNative Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build WiiXNative Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "WiiXNative-APK/settings.gradle.kts" ] || [ -f "WiiXNative-APK/settings.gradle" ]; then
            PROJECT_DIR="WiiXNative-APK"
          else
            echo "Não foi encontrado settings.gradle(.kts) na raiz ou em WiiXNative-APK/" >&2
            exit 1
          fi

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Arquivo app/build.gradle(.kts) não encontrado." >&2
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK, NDK e CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \\
            "platforms;android-34" \\
            "build-tools;34.0.0" \\
            "ndk;26.1.10909125" \\
            "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace -p "${{ steps.project.outputs.dir }}" :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-Android-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
