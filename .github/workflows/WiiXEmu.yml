name: WiiXEmu Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK, NDK e CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Adicionar splash de carregamento com ícone do jogo
        run: |
          echo '' | base64 -d > /tmp/patch_wiixemu.py
          python3 /tmp/patch_wiixemu.py
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: WiiXEmu-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
