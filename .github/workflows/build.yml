name: Build WiixEmu (visual) + Cemu (núcleo)

on:
  push:
  workflow_dispatch:

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixar o código do Cemu
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Instalar SDK/NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Montar projeto (interface WiixEmu + núcleo Cemu)
        shell: bash
        run: |
          set -e
          # 1) interface do WiixEmu
          echo "" | base64 -d > p.zip
          unzip -q p.zip
          APP=WiixEmuAndroid/app/src/main
          CEMU=src/android/app/src/main/java/info/cemu/cemu

          # 2) tira o núcleo próprio do WiixEmu (o Cemu assume)
          rm -rf $APP/cpp

          # 3) classes nativas do Cemu (o C++ do Cemu procura por esses nomes)
          mkdir -p $APP/java/info/cemu/cemu/emulation
          cp -r $CEMU/nativeinterface $APP/java/info/cemu/cemu/
          cp $CEMU/CemuApplication.kt $APP/java/info/cemu/cemu/
          if grep -rEq "BuildConfig|[^a-zA-Z]R\.(string|id|layout)" $APP/java/info/cemu/cemu; then
            echo "ERRO: classes nativas do Cemu dependem de recursos que não foram copiados"; exit 1
          fi

          # 4) ponte WiixEmu -> Cemu
          cat > $APP/java/dev/wiixemu/app/EmulatorBridge.kt <<'EOF'
          package dev.wiixemu.app

          import android.graphics.SurfaceTexture
          import android.os.ParcelFileDescriptor
          import android.view.Surface
          import info.cemu.cemu.nativeinterface.NativeEmulation
          import info.cemu.cemu.nativeinterface.NativeInput

          /**
           * Ponte entre a interface do WiixEmu e o núcleo do Cemu (libCemuAndroid.so).
           * Mantém as mesmas funções que a interface já chama; quem roda o jogo é o Cemu.
           */
          object EmulatorBridge {
              val loaded: Boolean = try { System.loadLibrary("CemuAndroid"); true } catch (t: Throwable) { false }

              @Volatile private var rendererReady = false
              @Volatile private var surface: Surface? = null
              @Volatile private var surfaceApplied = false
              @Volatile private var width = 0
              @Volatile private var height = 0
              @Volatile private var running = false
              @Volatile private var lastMsg = "Aguardando"

              private val lock = Any()
              private var prevMask = 0
              private var touching = false
              private var lastPx = 0
              private var lastPy = 0
              private val lastAxis = FloatArray(8) { -1f }

              // Btn do WiixEmu (bit) -> botão VPAD do Cemu
              private val vpad = intArrayOf(
                  NativeInput.VPAD_BUTTON_A, NativeInput.VPAD_BUTTON_B, NativeInput.VPAD_BUTTON_X, NativeInput.VPAD_BUTTON_Y,
                  NativeInput.VPAD_BUTTON_L, NativeInput.VPAD_BUTTON_R, NativeInput.VPAD_BUTTON_ZL, NativeInput.VPAD_BUTTON_ZR,
                  NativeInput.VPAD_BUTTON_PLUS, NativeInput.VPAD_BUTTON_MINUS, NativeInput.VPAD_BUTTON_HOME,
                  NativeInput.VPAD_BUTTON_UP, NativeInput.VPAD_BUTTON_DOWN, NativeInput.VPAD_BUTTON_LEFT, NativeInput.VPAD_BUTTON_RIGHT,
                  NativeInput.VPAD_BUTTON_STICKL, NativeInput.VPAD_BUTTON_STICKR
              )

              // ---------- tela de teste da aba Gráficos (o Cemu cuida da GPU) ----------
              fun nativeSurfaceCreated(surface: Surface) {}
              fun nativeSurfaceDestroyed() {}
              fun nativeVulkanReport(driver: String): String =
                  "Vulkan: gerenciado pelo núcleo do Cemu." +
                      (if (driver.isNotEmpty()) "\nDriver personalizado ainda não repassado ao Cemu." else "")
              fun nativeLoadTitle(path: String): String = ""

              // ---------- superfície de vídeo ----------
              private fun ensureRenderer() {
                  if (rendererReady) return
                  val st = SurfaceTexture(0)
                  val ts = Surface(st)
                  try { NativeEmulation.initializeRenderer(ts); rendererReady = true }
                  finally { ts.release(); st.release() }
              }

              private fun applySurface() {
                  val s = surface ?: return
                  if (surfaceApplied || width <= 0 || height <= 0) return
                  try {
                      ensureRenderer()
                      NativeEmulation.setSurfaceSize(width, height, true)
                      NativeEmulation.setSurface(s, true)
                      surfaceApplied = true
                  } catch (t: Throwable) { lastMsg = "falhou ao criar a superfície: ${t.message}" }
              }

              fun nativeEmuSurface(s: Surface?) {
                  synchronized(lock) {
                      if (s == null) {
                          if (surfaceApplied) try { NativeEmulation.clearSurface(true) } catch (t: Throwable) {}
                          surface = null; surfaceApplied = false
                      } else { surface = s; surfaceApplied = false; applySurface() }
                  }
              }

              /** Chamado pelo surfaceChanged da tela de jogo. */
              fun nativeSurfaceSize(w: Int, h: Int) {
                  synchronized(lock) {
                      width = w; height = h
                      if (surfaceApplied) try { NativeEmulation.setSurfaceSize(w, h, true) } catch (t: Throwable) {}
                      else applySurface()
                  }
              }

              // ---------- ciclo de vida ----------
              /** [name] chega com o endereço (uri) do jogo; o Cemu abre o arquivo/pasta por ele. */
              fun nativeStart(fd: Int, ext: String, name: String, settings: String): String {
                  if (fd >= 0) try { ParcelFileDescriptor.adoptFd(fd).close() } catch (t: Throwable) {}
                  return try {
                      val t0 = System.currentTimeMillis()
                      while (!surfaceApplied && System.currentTimeMillis() - t0 < 10000) Thread.sleep(100)
                      if (!surfaceApplied) return "ERRO: a superfície de vídeo não ficou pronta. $lastMsg"
                      NativeInput.setControllerType(0, NativeInput.EMULATED_CONTROLLER_TYPE_VPAD)
                      when (NativeEmulation.startGame(name)) {
                          NativeEmulation.START_GAME_SUCCESSFUL -> { running = true; lastMsg = "Cemu em execução"; "OK: Cemu iniciou o jogo" }
                          NativeEmulation.START_GAME_ERROR_GAME_BASE_FILES_NOT_FOUND -> "ERRO: arquivos base do jogo não encontrados."
                          NativeEmulation.START_GAME_ERROR_NO_DISC_KEY -> "ERRO: falta o disc key (keys.txt do seu console na pasta do Cemu)."
                          NativeEmulation.START_GAME_ERROR_NO_TITLE_TIK -> "ERRO: falta o title.tik deste jogo."
                          else -> "ERRO: o Cemu não conseguiu abrir $name"
                      }
                  } catch (t: Throwable) { "ERRO: ${t.message}" }
              }

              // O JNI do Cemu não tem pausa; o Cemu também encerra o processo ao sair do jogo.
              fun nativePause(paused: Boolean) {}
              fun nativeStop() {
                  if (running) android.os.Process.killProcess(android.os.Process.myPid())
              }
              fun nativeStatus(): String = if (running) "Cemu em execução" else lastMsg
              fun nativeReport(): String = "Núcleo: Cemu (CemuAndroid)\nEstado: ${nativeStatus()}"

              // ---------- entrada ----------
              fun nativeSetInput(buttons: Int, lx: Float, ly: Float, rx: Float, ry: Float) {
                  if (!running) return
                  val changed = buttons xor prevMask
                  if (changed != 0) {
                      for (bit in vpad.indices) {
                          val m = 1 shl bit
                          if (changed and m != 0) NativeInput.onOverlayButton(0, vpad[bit], buttons and m != 0)
                      }
                      prevMask = buttons
                  }
                  // ly/ry > 0 = para cima (convenção do WiixEmu)
                  axis(0, NativeInput.VPAD_BUTTON_STICKL_UP, maxOf(ly, 0f))
                  axis(1, NativeInput.VPAD_BUTTON_STICKL_DOWN, maxOf(-ly, 0f))
                  axis(2, NativeInput.VPAD_BUTTON_STICKL_LEFT, maxOf(-lx, 0f))
                  axis(3, NativeInput.VPAD_BUTTON_STICKL_RIGHT, maxOf(lx, 0f))
                  axis(4, NativeInput.VPAD_BUTTON_STICKR_UP, maxOf(ry, 0f))
                  axis(5, NativeInput.VPAD_BUTTON_STICKR_DOWN, maxOf(-ry, 0f))
                  axis(6, NativeInput.VPAD_BUTTON_STICKR_LEFT, maxOf(-rx, 0f))
                  axis(7, NativeInput.VPAD_BUTTON_STICKR_RIGHT, maxOf(rx, 0f))
              }

              private fun axis(slot: Int, id: Int, v: Float) {
                  if (lastAxis[slot] == v) return
                  lastAxis[slot] = v
                  NativeInput.onOverlayAxis(0, id, v)
              }

              /** x e y chegam de 0 a 1; o Cemu quer pixels da superfície. */
              fun nativeSetTouch(down: Boolean, x: Float, y: Float) {
                  if (!running) return
                  if (down) { lastPx = (x * width).toInt(); lastPy = (y * height).toInt() }
                  when {
                      down && !touching -> NativeInput.onTouchDown(lastPx, lastPy, true)
                      down -> NativeInput.onTouchMove(lastPx, lastPy, true)
                      touching -> NativeInput.onTouchUp(lastPx, lastPy, true)
                  }
                  touching = down
              }

              fun nativeSetGyro(x: Float, y: Float, z: Float) {}
          }
          EOF

          cat > $APP/java/info/cemu/cemu/emulation/EmulationActivity.kt <<'EOF'
          package info.cemu.cemu.emulation

          import androidx.annotation.Keep

          /** O núcleo C++ do Cemu procura esta classe pelo nome para abrir o teclado do jogo. */
          class EmulationActivity {
              companion object {
                  @Keep @JvmStatic fun showEmulationTextInput(initialText: String?, maxLength: Int) {}
                  @Keep @JvmStatic fun hideEmulationTextInput() {}
              }
          }
          EOF

          cat > WiixEmuAndroid/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val cmakeArguments = arrayOf(
              "-DANDROID_STL=c++_shared",
              "-DENABLE_VCPKG=ON",
              "-DVCPKG_TARGET_ANDROID=ON",
              "-DENABLE_SDL=OFF",
              "-DENABLE_WXWIDGETS=OFF",
              "-DENABLE_OPENGL=OFF",
              "-DENABLE_BLUEZ=OFF",
              "-DBUNDLE_SPEEX=ON",
              "-DENABLE_DISCORD_RPC=OFF",
              "-DENABLE_NSYSHID_LIBUSB=OFF",
              "-DENABLE_WAYLAND=OFF",
              "-DENABLE_HIDAPI=OFF",
              "-DCMAKE_C_FLAGS_DEBUG=-O2 -g0",
              "-DCMAKE_CXX_FLAGS_DEBUG=-O2 -g0"
          )

          android {
              namespace = "dev.wiixemu.app"
              compileSdk = 34
              ndkVersion = "26.1.10909125"

              defaultConfig {
                  applicationId = "dev.wiixemu.app"
                  minSdk = 29            // Android 10+ (como o WiixEmu)
                  targetSdk = 34
                  versionCode = 15
                  versionName = "0.8.0-cemu"
                  externalNativeBuild {
                      cmake {
                          arguments.addAll(cmakeArguments)
                          abiFilters("arm64-v8a")
                      }
                  }
              }

              packaging { jniLibs.useLegacyPackaging = true }

              buildTypes {
                  debug {
                      externalNativeBuild { cmake { arguments.add("-DCMAKE_BUILD_TYPE=Release") } }
                  }
                  release { isMinifyEnabled = false }
              }
              externalNativeBuild {
                  // CMakeLists.txt na raiz do repositório do Cemu (WiixEmuAndroid/app -> ../../)
                  cmake { path = file("../../CMakeLists.txt"); version = "3.22.1" }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.1")
              implementation("androidx.documentfile:documentfile:1.0.1")
              implementation("androidx.compose.ui:ui-graphics:1.6.8")   // ImageBitmap usado pelas classes nativas do Cemu
          }
          EOF

          # 5) pequenos ajustes na interface do WiixEmu
          F=$APP/java/dev/wiixemu/app/EmulationActivity.kt
          sed -i 's#EmulatorBridge.nativeStart(fd, ext, name, nativeSettings)#EmulatorBridge.nativeStart(fd, ext, intent.getStringExtra("uri") ?: name, nativeSettings)#' $F
          sed -i 's#override fun surfaceChanged(h: SurfaceHolder, f: Int, w: Int, hh: Int) {}#override fun surfaceChanged(h: SurfaceHolder, f: Int, w: Int, hh: Int) { if (EmulatorBridge.loaded) EmulatorBridge.nativeSurfaceSize(w, hh) }#' $F
          grep -q 'intent.getStringExtra("uri") ?: name' $F
          grep -q 'nativeSurfaceSize' $F
          sed -i 's#<application#<application android:name="info.cemu.cemu.CemuApplication"#' $APP/AndroidManifest.xml
          grep -q 'info.cemu.cemu.CemuApplication' $APP/AndroidManifest.xml

      - name: Compilar
        working-directory: WiixEmuAndroid
        shell: bash
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          echo "=== ERROS ==="
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: WiixEmuAndroid/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: WiixEmu-Cemu-debug-apk
          path: WiixEmuAndroid/app/build/outputs/apk/debug/app-debug.apk
