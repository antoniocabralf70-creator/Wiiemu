name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar SDK/NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Extrair projeto
        run: |
          echo "" | base64 -d > p.zip
          unzip -q p.zip
      - name: Compilar
        working-directory: WiixEmuAndroid
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          echo "=== ERROS ==="
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: WiixEmuAndroid/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: WiixEmu-debug-apk
          path: WiixEmuAndroid/app/build/outputs/apk/debug/app-debug.apk
