name: Build Cemu Android 10 - Wiix theme

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/android/**'
      - 'src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Cemu APK (arm64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Cemu source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      # The uploaded source ZIP contains the .gitmodules file but empty
      # submodule directories. Clone the declared dependencies for CI.
      - name: Fetch Cemu native dependencies
        shell: bash
        run: |
          set -euo pipefail
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            if [ -n "$url" ] && [ ! -f "$path/CMakeLists.txt" ] && [ ! -f "$path/README.md" ]; then
              echo "Cloning ${name} into ${path}"
              mkdir -p "$(dirname "$path")"
              git clone --depth 1 "$url" "$path"
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')

      - name: Apply Android 10 minimum and Wiix visual theme
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('src/android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'minSdk = 31' not in text:
              raise SystemExit('Could not find the expected Cemu minSdk = 31 setting')
          gradle.write_text(text.replace('minSdk = 31', 'minSdk = 29', 1))

          theme = Path('src/android/app/src/main/java/info/cemu/cemu/guicore/theme/Theme.kt')
          theme.write_text('''package info.cemu.cemu.guicore.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          
          // Wiix-inspired palette: dark background, charcoal cards and blue accent.
          private val WiixColorScheme = darkColorScheme(
              primary = Color(0xFF2D8CFF),
              onPrimary = Color(0xFFFFFFFF),
              background = Color(0xFF0F1115),
              onBackground = Color(0xFFF2F4F8),
              surface = Color(0xFF1A1D24),
              onSurface = Color(0xFFF2F4F8),
              surfaceVariant = Color(0xFF262B36),
              onSurfaceVariant = Color(0xFF9AA3B2)
          )
          
          @Composable
          fun CemuTheme(
              darkTheme: Boolean = true,
              dynamicColor: Boolean = false,
              content: @Composable () -> Unit,
          ) {
              MaterialTheme(
                  colorScheme = WiixColorScheme,
                  content = content
              )
          }
          ''')
          PY

      - name: Build Cemu debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Android10-Wiix-theme-test
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
