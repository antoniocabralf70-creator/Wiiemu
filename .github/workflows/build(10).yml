      - name: Testar interpretador PowerPC existente
        working-directory: WiiUEmuAndroid
        run: |
          g++ -std=c++20 -Iapp/src/main/cpp tests/cpu_test.cpp app/src/main/cpp/core/cpu.cpp -o cpu_test
          ./cpu_test
      - name: Compilar APK arm64-v8a
        working-directory: WiiUEmuAndroid
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Wiix-debug-apk
          path: WiiUEmuAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
