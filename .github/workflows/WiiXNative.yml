name: WiiXNative Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build WiiXNative (Android ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Verificar estrutura Android
        shell: bash
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK, NDK e CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Ajustar identidade do aplicativo para WiiXNative
        shell: bash
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/WiiXEmu/WiiXNative/g' app/src/main/AndroidManifest.xml
          fi
          if [ -f settings.gradle.kts ]; then
            sed -i 's/rootProject.name = "WiiXEmu"/rootProject.name = "WiiXNative"/' settings.gradle.kts
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/applicationId = "dev.wiixemu.android"/applicationId = "dev.wiixnative.android"/' app/build.gradle.kts
            sed -i 's/versionName = "0.5.0"/versionName = "0.1.0"/' app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            sed -i 's/dev.wiixemu.android/dev.wiixnative.android/g' app/build.gradle
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK ARM64
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-Android-ARM64-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
